<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WheelEngine 3D - Synthwave Edition</title>
  <style>
    :root {
      --bg-dark: #091428;
      --bg-gradient: linear-gradient(135deg, #091428 0%, #0A323C 100%);
      --glass-bg: rgba(9, 20, 40, 0.85);
      --glass-border: #C8AA6E;
      --glass-border-cyan: #0AC8B9;
      --text-main: #F0E6D2;
      --text-muted: #A09B8C;
      --neon-cyan: #0AC8B9;
      --neon-magenta: #C8AA6E;
      --neon-yellow: #F0E6D2;
      --neon-green: #0AC8B9;
      --danger: #ff4500;
    }
    
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      overflow: hidden;
    }
    
    /* Cyberpunk Grid Background Overlay */
    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        linear-gradient(rgba(255, 0, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
      background-size: 30px 30px;
      z-index: -1;
      pointer-events: none;
    }

    /* Common Glassmorphism Panels */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 0, 255, 0.05);
    }
    
    /* Topbar */
    .topbar {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      border-bottom: 1px solid var(--glass-border-cyan);
      background: rgba(5, 5, 16, 0.8);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
      z-index: 20;
      position: relative;
    }
    .logo-title {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 1.4rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 0 10px var(--neon-cyan);
    }
    .logo-title svg { stroke: var(--neon-cyan); }
    
    .status-live {
      color: var(--neon-green);
      font-weight: 800;
      text-shadow: 0 0 8px var(--neon-green);
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--neon-green);
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(10, 255, 80, 0.1);
      letter-spacing: 1px;
    }
    
    /* Main Layout */
    .app-container {
      display: flex;
      height: calc(100vh - 60px);
      position: relative;
    }
    
    /* Left Panel: File & Stats */
    .left-panel {
      width: 280px;
      margin: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      z-index: 10;
    }
    
    .file-loader {
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 15px;
    }
    
    /* FIX: Custom File Upload Button using Label */
    .file-input-wrapper {
      width: 100%;
    }
    .synth-btn {
      display: inline-block;
      width: calc(100% - 30px);
      background: linear-gradient(45deg, #0A323C, #0AC8B9);
      color: #F0E6D2;
      border: 1px solid #C8AA6E;
      padding: 12px 15px;
      border-radius: 4px;
      font-size: 0.9rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(10, 200, 185, 0.3);
      transition: all 0.3s ease;
      text-align: center;
    }
    .synth-btn:hover {
      box-shadow: 0 0 20px rgba(200, 170, 110, 0.6);
      transform: scale(1.02);
    }
    .synth-btn:active {
      transform: scale(0.98);
    }
    
    .file-name {
      font-size: 0.8rem;
      color: var(--neon-yellow);
      word-break: break-all;
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      padding: 20px;
    }
    .stat-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      padding: 15px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .stat-val {
      font-size: 1.4rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 8px var(--neon-cyan);
    }
    .stat-val.magenta { color: var(--neon-magenta); text-shadow: 0 0 8px var(--neon-magenta); }
    .stat-lbl {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 5px;
    }
    
    /* Center Canvas Area */
    .canvas-container {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #circlechart {
      max-width: 100%;
      max-height: 100%;
      cursor: grab;
    }
    #circlechart:active {
      cursor: grabbing;
    }
    
    /* Right Panel: Tools */
    .right-panel {
      width: 340px;
      margin: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
      padding-right: 5px;
      z-index: 10;
    }
    
    /* Custom Scrollbar */
    .right-panel::-webkit-scrollbar { width: 6px; }
    .right-panel::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 3px; }
    .right-panel::-webkit-scrollbar-thumb { background: var(--neon-magenta); border-radius: 3px; }
    
    .control-group {
      padding: 20px;
    }
    .control-group h4 {
      margin: 0 0 20px 0;
      font-size: 0.95rem;
      color: var(--neon-cyan);
      display: flex;
      align-items: center;
      gap: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 5px rgba(0, 240, 255, 0.5);
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      padding-bottom: 10px;
    }
    .sub-heading {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin: 15px 0 10px 0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
      font-size: 0.85rem;
    }
    .control-row label {
      color: var(--text-main);
      flex: 1;
      font-weight: 600;
    }
    
    /* Custom Neon Range Input */
    input[type=range] {
      flex: 1.5;
      -webkit-appearance: none;
      background: transparent;
      margin: 0 10px;
    }
    input[type=range]:focus { outline: none; }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }
    input[type=range]::-webkit-slider-thumb {
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: var(--neon-magenta);
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -6px;
      box-shadow: 0 0 10px var(--neon-magenta);
    }
    
    .control-row .val {
      width: 45px;
      text-align: right;
      color: var(--neon-yellow);
      font-weight: bold;
      font-size: 0.8rem;
    }
    
    .btn-outline {
      background: transparent;
      color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan);
      padding: 10px 0;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
    }
    .btn-outline:hover {
      background: rgba(0, 240, 255, 0.1);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }
    .btn-outline.active-red {
      color: var(--danger);
      border-color: var(--danger);
      box-shadow: 0 0 15px rgba(255, 0, 60, 0.3);
    }
    .btn-outline.active-red:hover {
      background: rgba(255, 0, 60, 0.1);
    }

    /* Enhanced Swatches for Colors */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 15px;
    }
    .color-swatch {
      aspect-ratio: 1;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .color-swatch:hover {
      transform: scale(1.1);
    }
    .color-swatch.active {
      border: 2px solid #fff;
      box-shadow: 0 0 12px currentColor;
    }

    /* Responsive Mobile Styles */
    @media (max-width: 800px) {
      body, html {
        height: auto;
        overflow: auto;
      }
      .app-container {
        flex-direction: column;
        height: auto;
      }
      .left-panel, .right-panel {
        width: 90%;
        margin: 15px auto;
      }
      .canvas-container {
        min-height: 50vh;
        width: 100%;
      }
      .topbar {
        height: auto;
        flex-direction: column;
        padding: 15px;
        gap: 10px;
      }
      .status-live {
        align-self: center;
      }
      .color-grid {
        grid-template-columns: repeat(6, 1fr);
      }
    }
  </style>
</head>
<body>

  <!-- Barra Superior -->
  <header class="topbar">
    <div class="logo-title">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
      <span>Graficacion <span style="color: var(--neon-magenta); font-size: 0.8rem;">HEXTECH</span></span>
    </div>
    <div class="status-live">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"></circle></svg>
      ONLINE
    </div>
  </header>

  <div class="app-container">
    
    <!-- Panel Izquierdo Flotante (Stats & File) -->
    <div class="left-panel">
      <!-- Carga de Archivos -->
      <div class="glass-panel file-loader">
        <div class="file-input-wrapper">
          <label for="file-input" class="synth-btn">
            [+] Cargar Malla 3D
          </label>
          <input type="file" id="file-input" accept=".txt,.dat,.obj" style="display: none;" />
        </div>
        <button id="btn-load-pinza" class="btn-outline" style="margin-top: 10px;">🛠️ Cargar Pinza Articulada</button>
        <div class="file-name" id="file-name-display">&lt; NO LOADED DATA &gt;</div>
      </div>

      <!-- Estadísticas -->
      <div class="glass-panel stats-grid">
        <div class="stat-box">
          <span class="stat-val" id="stat-fps">144</span>
          <span class="stat-lbl">FPS</span>
        </div>
        <div class="stat-box">
          <span class="stat-val magenta" id="stat-ms">4.2</span>
          <span class="stat-lbl">MS</span>
        </div>
        <div class="stat-box">
          <span class="stat-val" id="stat-verts">0</span>
          <span class="stat-lbl">VERTICES</span>
        </div>
        <div class="stat-box">
          <span class="stat-val magenta" id="stat-tris">0</span>
          <span class="stat-lbl">POLYS</span>
        </div>
        <div class="stat-box" style="grid-column: span 2;">
          <span class="stat-val" id="bottom-stat-vel">45°/s</span>
          <span class="stat-lbl">VELOCIDAD DE ROTACIÓN</span>
        </div>
      </div>

      <!-- Código Crudo -->
      <div class="glass-panel" style="display: flex; flex-direction: column; flex-grow: 1; padding: 15px; max-height: 250px;">
        <h4 style="margin: 0 0 10px 0; font-size: 0.75rem; color: var(--neon-cyan); letter-spacing: 1px; border-bottom: 1px solid rgba(0,240,255,0.2); padding-bottom: 5px;">RAW FILE DATA</h4>
        <textarea id="raw-file-content" readonly style="flex-grow: 1; width: 100%; box-sizing: border-box; background: rgba(0,0,0,0.6); border: 1px solid var(--glass-border); color: #0AC8B9; font-family: 'Courier New', Courier, monospace; font-size: 0.7rem; padding: 8px; border-radius: 4px; resize: none;"></textarea>
      </div>
    </div>

    <!-- Área del Visor (Canvas) -->
    <main class="canvas-container" id="canvas-container">
      <canvas id="circlechart" width="800" height="600"></canvas>
    </main>

    <!-- Panel Derecho (Controles) -->
    <aside class="right-panel">
      
      <!-- ANIMACIÓN -->
      <div class="glass-panel control-group">
        <h4>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
          ANIMACIÓN
        </h4>
        <div class="control-row" style="margin-bottom: 25px;">
          <button id="btn-auto-rotate" class="btn-outline active-red">■ DETENER CORE</button>
        </div>
        <div class="control-row">
          <label style="flex:1">Velocidad</label>
          <input type="range" id="input-velocidad" min="0" max="180" value="45" step="1">
          <span class="val" id="val-velocidad">45°/s</span>
        </div>
        <div class="control-row">
          <label style="flex:1">Apertura</label>
          <input type="range" id="input-apertura" min="0" max="30" value="0" step="1">
          <span class="val" id="val-apertura">0°</span>
        </div>
      </div>

      <!-- ILUMINACIÓN -->
      <div class="glass-panel control-group">
        <h4>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
          ILUMINACIÓN
        </h4>
        <div class="control-row">
          <label>Light X</label>
          <input type="range" id="input-luzX" min="-5" max="5" value="1.50" step="0.01">
          <span class="val" id="val-luzX">1.50</span>
        </div>
        <div class="control-row">
          <label>Light Y</label>
          <input type="range" id="input-luzY" min="-5" max="5" value="2.00" step="0.01">
          <span class="val" id="val-luzY">2.00</span>
        </div>
        <div class="control-row">
          <label>Light Z</label>
          <input type="range" id="input-luzZ" min="-5" max="5" value="1.20" step="0.01">
          <span class="val" id="val-luzZ">1.20</span>
        </div>
        <div class="control-row">
          <label>Ambiente</label>
          <input type="range" id="input-amb" min="0" max="1" value="0.25" step="0.05">
          <span class="val" id="val-amb">0.25</span>
        </div>
      </div>

      <!-- COLORES -->
      <div class="glass-panel control-group">
        <h4>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l10 6.5v7L12 22 2 15.5v-7L12 2z"/></svg>
          COLORES
        </h4>
        <div class="sub-heading">PALETA DE MALLA</div>
        <div class="color-grid">
          <!-- Cyberpunk Palette -->
          <div class="color-swatch active" style="background-color: #00f0ff; color: #00f0ff;"></div>
          <div class="color-swatch" style="background-color: #ff00ff; color: #ff00ff;"></div>
          <div class="color-swatch" style="background-color: #fcee0a; color: #fcee0a;"></div>
          <div class="color-swatch" style="background-color: #0aff50; color: #0aff50;"></div>
          
          <div class="color-swatch" style="background-color: #ff003c; color: #ff003c;"></div>
          <div class="color-swatch" style="background-color: #8a2be2; color: #8a2be2;"></div>
          <div class="color-swatch" style="background-color: #ff4500; color: #ff4500;"></div>
          <div class="color-swatch" style="background-color: #1e90ff; color: #1e90ff;"></div>
          
          <div class="color-swatch" style="background-color: #ffffff; color: #ffffff;"></div>
          <div class="color-swatch" style="background-color: #333333; color: #333333;"></div>
          <div class="color-swatch" style="background-color: #00ffcc; color: #00ffcc;"></div>
          <div class="color-swatch" style="background-color: #ff1493; color: #ff1493;"></div>
        </div>
      </div>
      
      <!-- CÁMARA -->
      <div class="glass-panel control-group">
        <h4>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
          CÁMARA
        </h4>
        <div class="control-row">
          <label>Eye Z</label>
          <input type="range" id="input-eyeZ" min="1" max="20" value="4.5" step="0.1">
          <span class="val" id="val-eyeZ">4.5</span>
        </div>
        <div class="control-row" style="margin-bottom:0">
          <label>ZOOM</label>
          <input type="range" id="input-fov" min="10" max="120" value="38" step="1">
          <span class="val" id="val-fov">38°</span>
        </div>
      </div>

      <!-- Rotación Manual -->
      <div class="glass-panel" id="ui-rotacion">
        <h3>CONTROLES DE ROTACIÓN</h3>
        <div class="dpad-container" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; width: 140px; margin: 15px auto;">
          <div></div>
          <button class="synth-btn" id="btn-rot-up" style="padding: 10px; font-size: 1.2rem; display: flex; justify-content: center; align-items: center;">▲</button>
          <div></div>
          <button class="synth-btn" id="btn-rot-left" style="padding: 10px; font-size: 1.2rem; display: flex; justify-content: center; align-items: center;">◀</button>
          <div style="display: flex; justify-content: center; align-items: center; color: var(--neon-cyan); opacity: 0.5;">✥</div>
          <button class="synth-btn" id="btn-rot-right" style="padding: 10px; font-size: 1.2rem; display: flex; justify-content: center; align-items: center;">▶</button>
          <div></div>
          <button class="synth-btn" id="btn-rot-down" style="padding: 10px; font-size: 1.2rem; display: flex; justify-content: center; align-items: center;">▼</button>
          <div></div>
        </div>
      </div>

      <button class="synth-btn" id="btn-auto-rotate" style="margin-top: auto; font-size: 1.1rem; padding: 15px;">▶ Animar</button>

    </aside>

  </div>

  <script src="./dist/src/index.js" type="module"></script>
</body>
</html>

<!-- GitHub pages trigger -->
